name: PostgreSQL tenant contract

on:
  push:
    paths:
      - 'platform/db/**'
      - 'platform/src/auth.mjs'
      - 'platform/src/postgres-store.mjs'
      - 'platform/src/server-postgres.mjs'
      - 'platform/test/postgres-http.test.mjs'
      - 'package.json'
      - '.github/workflows/postgres-contract.yml'
  pull_request:
    paths:
      - 'platform/db/**'
      - 'platform/src/auth.mjs'
      - 'platform/src/postgres-store.mjs'
      - 'platform/src/server-postgres.mjs'
      - 'platform/test/postgres-http.test.mjs'
      - 'package.json'
      - '.github/workflows/postgres-contract.yml'

permissions:
  contents: read

jobs:
  rls-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_company_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - run: psql -h 127.0.0.1 -U postgres -d ai_company_os_test -f platform/db/001_company_foundation.sql
      - run: psql -h 127.0.0.1 -U postgres -d ai_company_os_test -f platform/db/test/tenant_rls.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_company_os_test
